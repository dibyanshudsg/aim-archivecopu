name: Search indexing
run-name: ${{ inputs.request_id && format('Admin indexing {0}', inputs.request_id) || 'Manual search indexing' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Admin request identifier (leave empty for a direct manual run)
        type: string
        default: ''
      verify_worker:
        description: Run an isolated native-text and scanned-PDF worker test
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-indexing-production
  cancel-in-progress: false

jobs:
  index:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.verify_worker && 15 || 75 }}
    env:
      INDEXING_OCR_CACHE_PATH: ${{ github.workspace }}/.ocr-cache
      INDEXING_REQUEST_ID: ${{ inputs.request_id }}
      # Public configuration, not a credential. Override when the asset origin changes.
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-3ed08073797148cf93d772ea1eb341f9.r2.dev' }}
      R2_LEGACY_PUBLIC_BASE_URLS: ${{ vars.R2_LEGACY_PUBLIC_BASE_URLS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for queued issues
        id: queue
        if: '!inputs.verify_worker'
        env:
          TURSO_DATABASE_URL: ${{ secrets.INDEXING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.INDEXING_TURSO_AUTH_TOKEN }}
        run: python3 scripts/indexing-schedule.py check
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.queue.outputs.pending == 'true' || inputs.verify_worker
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.queue.outputs.pending == 'true' || inputs.verify_worker
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.queue.outputs.pending == 'true' || inputs.verify_worker
        with:
          path: .ocr-cache
          key: indexing-english-ocr-v5-${{ runner.os }}
      - name: Install worker dependencies
        if: steps.queue.outputs.pending == 'true' || inputs.verify_worker
        run: pnpm install --frozen-lockfile --filter @aim-archive/web...
      - name: Verify worker with isolated PDFs
        if: inputs.verify_worker
        run: |
          node scripts/test-indexing-runner.cjs
          node scripts/test-indexing-controls.cjs
          python3 scripts/test-indexing-schedule.py
          node scripts/test-indexing-worker-pdf.cjs
      - name: Verify production database access without changes
        if: inputs.verify_worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.INDEXING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.INDEXING_TURSO_AUTH_TOKEN }}
        run: python3 scripts/indexing-schedule.py verify
      - name: Verify private source access without changes
        if: steps.queue.outputs.pending == 'true' || inputs.verify_worker
        env:
          R2_ACCOUNT_ID: ${{ secrets.INDEXING_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.INDEXING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.INDEXING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.INDEXING_R2_SECRET_ACCESS_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.INDEXING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.INDEXING_TURSO_AUTH_TOKEN }}
        run: node scripts/verify-private-worker.cjs
      - name: Process queued issues
        if: steps.queue.outputs.pending == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.INDEXING_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.INDEXING_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.INDEXING_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.INDEXING_R2_SECRET_ACCESS_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.INDEXING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.INDEXING_TURSO_AUTH_TOKEN }}
        run: node scripts/indexing-worker.cjs --drain
      - name: Record completion
        if: always() && !inputs.verify_worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.INDEXING_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.INDEXING_TURSO_AUTH_TOKEN }}
          RUN_RESULT: ${{ job.status }}
        run: python3 scripts/indexing-schedule.py "$RUN_RESULT"
